<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal del Equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TOKENS
     ============================================================ */
  :root{
    --bg:            #EEF1EE;
    --bg-soft:       #E5E9E4;
    --surface:       #FFFFFF;
    --ink:           #16231F;
    --ink-soft:      #4B5850;
    --line:          #CBD3CB;
    --line-soft:     #DCE2DB;
    --teal:          #2F6F5E;
    --teal-dark:     #234F43;
    --ochre:         #C98A3B;
    --radius:        3px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1100px circle at 8% -12%, rgba(47,160,232,0.30), transparent 52%),
      radial-gradient(950px circle at 102% -8%, rgba(255,216,102,0.38), transparent 48%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    margin:0;
    color:var(--ink);
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }

  .wrap{ max-width:1080px; margin:0 auto; padding:0 28px; }

  /* ---------- header ---------- */
  header{
    padding:24px 0;
    border-bottom:1px solid var(--line);
  }
  header .wrap{
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand .mark{
    height:44px; width:auto;
    display:block;
    flex-shrink:0;
  }
  .brand-name{
    font-family:'Baloo 2', sans-serif;
    font-size:24px; color:var(--ink); font-weight:700;
    line-height:1; margin-top:-2px;
  }
  .header-right{ display:flex; align-items:center; gap:16px; }
  .partner-logo{ height:26px; width:auto; display:block; }
  #backBtn{
    background:none; border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; font-size:14px; color:var(--ink-soft);
    display:none;
  }
  #backBtn:hover{ border-color:var(--teal); color:var(--teal-dark); }
  #backBtn.show{ display:inline-block; }

  /* ---------- status bar (date / weather / verse) ---------- */
  .status-bar{
    border-bottom:1px solid var(--line-soft);
  }
  .status-inner{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:9px 28px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .status-inner .dot{ color:var(--line); }
  #statusVerse{ font-style:italic; }

  /* ---------- hero (home only) ---------- */
  .hero{
    margin:24px 0 36px;
    padding:30px 34px;
    border-radius:24px;
    background:linear-gradient(135deg, #2FA0E8 0%, #0B4F91 100%);
    box-shadow:0 16px 32px -18px rgba(11,79,145,0.55);
  }
  .hero .eyebrow{
    font-size:13px; color:#FFD866; margin-bottom:10px; font-weight:700;
  }
  .hero h1{
    font-size:clamp(28px,4vw,42px);
    line-height:1.08;
    max-width:16ch;
    color:#fff;
  }
  .hero h1 .line2{ color:#AEDCFA; }
  .hero p{
    max-width:46ch; margin-top:12px; color:#E4F1FC; font-size:15.5px;
  }

  /* ---------- home grid ---------- */
  .home-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    grid-auto-rows:auto;
    gap:12px;
    padding-bottom:48px;
    align-items:stretch;
  }

  .card{
    background:var(--card-tint, var(--surface));
    border:2px solid var(--card-accent, var(--line));
    border-radius:var(--card-radius, 28px 12px 28px 12px);
    padding:16px 18px;
    display:flex; flex-direction:column; justify-content:space-between;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 24px -12px var(--card-accent, var(--teal));
  }
  .card .top{ display:flex; align-items:flex-start; justify-content:space-between; }
  .card .icon{ font-size:26px; }
  .card .count{
    font-size:12px; color:var(--card-accent-dark, var(--ink-soft));
    border:1px solid var(--card-accent, var(--line-soft));
    border-radius:999px;
    padding:3px 10px;
    background:var(--surface);
  }
  .card h3{ font-size:18px; margin-top:8px; }
  .card p{ color:var(--ink-soft); font-size:13.5px; margin-top:4px; max-width:36ch; }
  .card .go{ margin-top:8px; font-size:13px; color:var(--card-accent-dark, var(--teal-dark)); font-weight:500; }

  @media (max-width:720px){
    .home-grid{ grid-template-columns:1fr; }
  }

  /* ---------- section view ---------- */
  .section-view{ display:none; padding:48px 0 64px; }
  .section-view.active{ display:block; }
  .section-head{ margin-bottom:32px; }
  .section-head .eyebrow{ font-size:14px; color:var(--ochre); margin-bottom:10px; font-weight:500; }
  .section-head h2{ font-size:32px; }
  .section-head p{ color:var(--ink-soft); margin-top:10px; }

  .item-list{ display:flex; flex-direction:column; gap:10px; }
  .item{
    display:flex; align-items:center; gap:16px;
    padding:11px 18px;
    background:var(--surface);
    border:2px solid var(--card-accent, var(--line-soft));
    border-radius:20px 6px 20px 6px;
  }
  .item .icon{ font-size:22px; width:32px; text-align:center; flex-shrink:0; }
  .item .info{ flex:1; min-width:0; }
  .item .info .tag{ font-size:12.5px; color:var(--card-accent-dark, var(--teal-dark)); font-weight:500; }
  .item .info h4{ font-family:'Work Sans',sans-serif; font-weight:600; font-size:16px; margin:2px 0 0; }
  .item .info span.desc{ font-size:14px; color:var(--ink-soft); }
  .item .open{
    flex-shrink:0; font-size:14px; color:var(--card-accent-dark, var(--ink-soft));
    border:1px solid var(--card-accent, var(--line)); border-radius:999px;
    padding:7px 16px; white-space:nowrap; background:var(--surface);
  }
  .item .open:hover{ background:var(--card-accent, var(--teal)); color:#fff; }

  #home-view{ display:block; }

  footer{ border-top:1px solid var(--line); padding:22px 0; margin-top:20px; }
  footer .wrap{ font-size:13px; color:var(--ink-soft); }
</style>
</head>

/* ================================================================

function renderAll(){
  document.getElementById('brandName').textContent  = CONFIG.brand.name;
  document.getElementById('heroEyebrow').textContent = CONFIG.brand.eyebrow;
  document.getElementById('heroTitle').innerHTML     = CONFIG.brand.heroTitle;
  document.getElementById('heroSub').textContent     = CONFIG.brand.heroSub;

  // Formas de esquina orgánicas: se van alternando entre secciones/items
  const shapes = [
    '28px 12px 28px 12px',
    '12px 28px 12px 28px',
    '30px 30px 8px 30px',
    '8px 30px 30px 30px'
  ];
  const tint = (hex, alpha) => {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  };
  const shade = (hex, amt) => {
    const r = Math.max(0, parseInt(hex.slice(1,3),16) - amt);
    const g = Math.max(0, parseInt(hex.slice(3,5),16) - amt);
    const b = Math.max(0, parseInt(hex.slice(5,7),16) - amt);
    return `rgb(${r},${g},${b})`;
  };

  const grid = document.getElementById('homeGrid');
  grid.innerHTML = CONFIG.sections.map((s, i) => `
    <div class="card" onclick="goSection('${s.key}')" style="
      --card-accent:${s.accent};
      --card-tint:${tint(s.accent, 0.05)};
      --card-accent-dark:${shade(s.accent, 40)};
      --card-radius:${shapes[i % shapes.length]};
    ">
      <div class="top">
        <span class="icon">${s.icon}</span>
        <span class="count">${s.items.length} elementos</span>
      </div>
      <div>
        <h3>${s.title}</h3>
        <p>${s.desc}</p>
        <div class="go">Ir a ${s.title.toLowerCase()} →</div>
      </div>
    </div>
  `).join('');

  const container = document.getElementById('sections-container');
  container.innerHTML = CONFIG.sections.map(s => `
    <div class="section-view" id="view-${s.key}" style="
      --card-accent:${s.accent};
      --card-accent-dark:${shade(s.accent, 40)};
    ">
      <div class="section-head">
        <div class="eyebrow">${s.icon} ${s.title}</div>
        <h2>${s.title}</h2>
        <p>${s.desc}</p>
      </div>
      <div class="item-list">
        ${s.items.map((it, i) => `
          <div class="item" style="border-radius:${shapes[i % shapes.length]};">
            <span class="icon">${it.icon}</span>
            <div class="info">
              <span class="tag">${it.tag}</span>
              <h4>${it.title}</h4>
              <span class="desc">${it.desc}</span>
            </div>
            ${it.url ? `<a class="open" href="${it.url}" target="_blank" rel="noopener">Abrir</a>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function goSection(key){
  document.getElementById('home-view').style.display = 'none';
  document.querySelectorAll('.section-view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + key).classList.add('active');
  document.getElementById('backBtn').classList.add('show');
  window.scrollTo(0,0);
}

function goHome(){
  document.querySelectorAll('.section-view').forEach(v => v.classList.remove('active'));
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('backBtn').classList.remove('show');
  window.scrollTo(0,0);
}

function diaDelAnio(d){
  const inicio = new Date(d.getFullYear(), 0, 0);
  const diff = d - inicio;
  return Math.floor(diff / 86400000);
}

function actualizarFecha(){
  const ahora = new Date();

  }).format(ahora);

function climaEmoji(code){
  if (code === 0) return '☀️ Despejado';
  if (code === 1 || code === 2) return '🌤️ Parcialmente nublado';
  if (code === 3) return '☁️ Nublado';
  if (code === 45 || code === 48) return '🌫️ Neblina';
  if (code >= 51 && code <= 67) return '🌧️ Lluvia';
  if (code >= 71 && code <= 77) return '❄️ Nieve';
  if (code >= 80 && code <= 82) return '🌦️ Chaparrones';
  if (code >= 95) return '⛈️ Tormenta';
  return '🌡️ Clima';
}

async function actualizarClima(){
  try{
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816&current_weather=true');
    const data = await res.json();
    const t = Math.round(data.current_weather.temperature);
    const desc = climaEmoji(data.current_weather.weathercode);
    document.getElementById('statusWeather').textContent = `${desc} · ${t}°C en Buenos Aires`;
  }catch(e){
    document.getElementById('statusWeather').textContent = '🌡️ Clima no disponible';
  }
}
